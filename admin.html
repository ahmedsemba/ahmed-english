<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><title>ادمن</title></head>
<body>
<h2>لوحة الادمن</h2>
<div id="list">جاري التحميل...</div>
<script>
const URL="https://script.google.com/macros/s/AKfycbw3tS1p1G7srl_kZD3VH1wl24syiafZkJIN8HeOHepjjQYwf-cMrgglcO6eG1S1UusP/exec";
async function load(){
let r=await fetch(URL);let d=await r.json();
let h='';
for(let i=1;i<d.length;i++){
h+=`<div>${d[i][0]} - ${d[i][3]} - ${d[i][6]} <button onclick="approve('${d[i][3]}')">موافقة</button></div><hr>`;
}
document.getElementById('list').innerHTML=h;
}
async function approve(u){
await fetch(URL,{method:'POST',body:JSON.stringify({action:'approve',username:u})});
alert('تمت الموافقة');load();
}
load();
</script>
</body>
</html>

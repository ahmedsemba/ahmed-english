<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم المستر</title>
<style>body{font-family:system-ui;background:#f5f7ff;padding:20px}.card{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:16px}input{width:70%;padding:12px;border-radius:10px;border:1px solid #ddd}.btn{padding:12px;background:#5b5bf6;color:#fff;border:0;border-radius:10px;cursor:pointer;margin:5px}.list{margin-top:15px}li{padding:8px;background:#f1f1f1;margin:5px 0;border-radius:8px;display:flex;justify-content:space-between}</style>
</head>
<body>
<div class="card">
<h2>🎛️ لوحة تحكم مستر أحمد</h2>
<input type="password" id="pass" placeholder="باسورد الادمن Ahmed@1983">
<button class="btn" onclick="login()">دخول</button>
<div id="panel" style="display:none">
<h3>🔴 التحكم في اللايف</h3>
<input id="room" placeholder="اسم غرفة اليوم"><button class="btn" onclick="saveRoom()">حفظ اسم الغرفة</button>
<h3>🚫 وقف كود طالب</h3>
<input id="codeBlock" placeholder="EN-...."><button class="btn" style="background:#e11d48" onclick="block()">وقف</button>
<h3>✅ فك الحظر</h3>
<input id="codeUnblock" placeholder="EN-...."><button class="btn" style="background:#22c55e" onclick="unblock()">فك</button>
<h3>📋 الأكواد الموقوفة</h3>
<ul id="blockedList" class="list"></ul>
<h3>📊 الحضور اليوم</h3>
<ul id="attendList" class="list"></ul>
<button class="btn" onclick="clearAttend()" style="background:#888">مسح الحضور</button>
</div>
</div>
<script>
function login(){if(document.getElementById('pass').value==='Ahmed@1983'){document.getElementById('panel').style.display='block'; render()}else alert('غلط')}
function saveRoom(){localStorage.setItem('live_room',document.getElementById('room').value); alert('اتحفظ')}
function block(){let c=document.getElementById('codeBlock').value.trim();let b=JSON.parse(localStorage.getItem('blocked_codes')||'[]');if(!b.includes(c)){b.push(c);localStorage.setItem('blocked_codes',JSON.stringify(b))}render()}
function unblock(){let c=document.getElementById('codeUnblock').value.trim();let b=JSON.parse(localStorage.getItem('blocked_codes')||'[]');b=b.filter(x=>x!==c);localStorage.setItem('blocked_codes',JSON.stringify(b));render()}
function render(){let b=JSON.parse(localStorage.getItem('blocked_codes')||'[]');document.getElementById('blockedList').innerHTML=b.map(x=>`<li>${x} <button onclick="unblockCode('${x}')">فك</button></li>`).join('')||'مفيش';let a=JSON.parse(localStorage.getItem('attendance')||'[]');document.getElementById('attendList').innerHTML=a.map(x=>`<li>${x.name} - ${x.code} - ${x.time}</li>`).join('')||'لسه محدش دخل'}
function unblockCode(c){let b=JSON.parse(localStorage.getItem('blocked_codes')||'[]');b=b.filter(x=>x!==c);localStorage.setItem('blocked_codes',JSON.stringify(b));render()}
function clearAttend(){localStorage.removeItem('attendance');render()}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحكم المستر</title>
<style>body{font-family:system-ui;background:#f5f7ff;margin:0;padding:15px}.card{max-width:600px;margin:15px auto;background:#fff;padding:20px;border-radius:16px}input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}.btn{width:100%;padding:12px;background:#5b5bf6;color:#fff;border:0;border-radius:10px;font-weight:bold;margin-top:6px;cursor:pointer}.item{display:flex;justify-content:space-between;background:#f8f8ff;padding:10px;border-radius:10px;margin:6px 0}</style>
</head>
<body>
<div class="card">
<h2>⚙️ تحكم - نظام الكود الثابت</h2>
<label>رابط لايف يوتيوب</label><input id="link" placeholder="https://youtube.com/watch?v=...">
<button class="btn" onclick="saveLink()">حفظ رابط اللايف</button>
<hr>
<label>اعمل بلوك لكود طالب مدفعش</label>
<input id="blockCode" placeholder="اكتب كود الطالب EN-...">
<button class="btn" style="background:#e11d48" onclick="block()">🚫 بلوك</button>
<button class="btn" style="background:#22c55e" onclick="unblock()">✅ فك البلوك</button>
<p id="msg" style="text-align:center;color:green"></p>
<h3>الاكواد الموقوفة حاليا:</h3>
<div id="list"></div>
<button class="btn" style="background:#111" onclick="window.open('live.html','_blank')">شوف صفحة الطالب</button>
</div>
<script>
document.getElementById('link').value=localStorage.getItem('live_link')||'';
function saveLink(){localStorage.setItem('live_link',document.getElementById('link').value); document.getElementById('msg').innerText='اتحفظ';}
function getBlocked(){return JSON.parse(localStorage.getItem('blocked_codes')||'[]');}
function block(){let c=document.getElementById('blockCode').value.trim(); let b=getBlocked(); if(c&&!b.includes(c)){b.push(c); localStorage.setItem('blocked_codes',JSON.stringify(b));} render(); document.getElementById('msg').innerText='اتعمله بلوك';}
function unblock(){let c=document.getElementById('blockCode').value.trim(); let b=getBlocked().filter(x=>x!==c); localStorage.setItem('blocked_codes',JSON.stringify(b)); render(); document.getElementById('msg').innerText='اتفك البلوك';}
function render(){let b=getBlocked(); document.getElementById('list').innerHTML=b.length?b.map(x=>`<div class=item><span>${x}</span><span>🚫</span></div>`).join(''):'<p style="color:#888">مفيش حد معموله بلوك</p>';}
render();
</script>
</body>
</html>

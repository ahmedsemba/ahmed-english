<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الادمن</title>
<style>body{font-family:Tahoma;background:#f1f5f9;padding:20px}.card{background:#fff;padding:15px;margin:10px 0;border-radius:12px;display:flex;justify-content:space-between;flex-wrap:wrap}.btn{background:#16a34a;color:#fff;border:none;padding:8px 15px;border-radius:8px;cursor:pointer}</style>
</head>
<body>
<h2>لوحة التحكم</h2><button onclick="loadData()" style="padding:10px 20px;background:#2563eb;color:#fff;border:none;border-radius:8px">🔄 تحديث</button>
<div id="list">جاري التحميل...</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMUKltPbOsqEN1LKoY_rtzfWVyy26KWUg22P2l2VIYUJ--iSPzwOB0tB1gfi5n8DHl/exec";
async function loadData(){
  document.getElementById('list').innerHTML='جاري التحميل...';
  let res=await fetch(SCRIPT_URL); let data=await res.json(); let html='';
  for(let i=1;i<data.length;i++){let r=data[i]; if(!r[0])continue;
    if(r[6]=='approved'){html+=`<div class="card"><div><b>${r[0]}</b> - ${r[3]} - <span style="color:green">موافق: ${r[5]}</span></div></div>`;}
    else{html+=`<div class="card"><div><b>${r[0]}</b><br>يوزر:${r[3]} | ${r[1]}</div><div><input id="code_${r[3]}" placeholder="الكود" style="padding:8px;border-radius:6px;border:1px solid #ccc"><button class="btn" onclick="approve('${r[3]}')">موافقة</button></div></div>`;}
  }
  document.getElementById('list').innerHTML=html||'لا يوجد طلاب';
}
async function approve(user){let code=document.getElementById('code_'+user).value; if(!code){alert('اكتب الكود');return;} await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams({action:'approve',user:user,code:code})}); alert('تم'); loadData();}
loadData();
</script></body></html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة مستر أحمد السيد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:20px;text-align:center}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:#1e293b;border-radius:16px;padding:20px;margin-bottom:15px}
input,select,button,textarea{width:100%;padding:12px;border-radius:10px;border:none;margin-top:10px;font-size:15px}
input,select,textarea{background:#0f172a;color:#fff;border:1px solid #334155}
button{background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}
.tab{flex:1;text-align:center;padding:12px;background:#1e293b;border-radius:10px;cursor:pointer;font-size:14px}
.tab.active{background:#4f46e5}.tabs{display:flex;gap:8px;margin-bottom:15px}
.lesson{background:#0f172a;border:1px solid #334155;padding:15px;border-radius:12px;margin-top:12px}
.meetBtn{background:#10b981;display:inline-block;text-decoration:none;padding:10px 18px;border-radius:8px;color:#fff;font-weight:bold;margin-top:8px}
.ytBtn{background:#ef4444;display:inline-block;text-decoration:none;padding:8px 14px;border-radius:8px;color:#fff;margin:5px}
</style>
</head>
<body>
<header><h1>منصة مستر أحمد السيد 📚</h1><p>الثانوية العامة - لغة انجليزية</p></header>
<div class="container">
<div class="tabs">
<div class="tab active" onclick="showTab('student')">دخول الطلاب</div>
<div class="tab" onclick="showTab('register')">تسجيل</div>
<div class="tab" onclick="showTab('admin')">لوحة المستر</div>
</div>

<div id="tab-register" class="card" style="display:none">
<h3>تسجيل طالب جديد</h3>
<input id="name" placeholder="الاسم ثلاثي">
<input id="phone" placeholder="رقم الواتساب">
<input id="parentPhone" placeholder="رقم ولي الأمر">
<select id="grade"><option>الصف الثالث الثانوي</option><option>الصف الثاني</option><option>الصف الأول</option></select>
<button onclick="registerStudent()">تسجيل</button><p id="regMsg"></p>
</div>

<div id="tab-student" class="card">
<h3>دخول الطالب</h3>
<input id="loginPhone" placeholder="رقم الواتساب">
<button onclick="loginStudent()">دخول</button><p id="loginMsg"></p>
<div id="studentArea" style="display:none">
<h2 id="welcome"></h2>
<div id="lessonsList"></div>
</div>
</div>

<div id="tab-admin" class="card" style="display:none">
<h3>لوحة المستر 🔒</h3>
<input id="adminPass" type="password" placeholder="الباسورد 12345">
<button onclick="loginAdmin()">دخول</button>
<div id="adminArea" style="display:none">
<div class="card" style="background:#0f172a">
<h4>➕ اضافة حصة / لينك جديد</h4>
<input id="lessonTitle" placeholder="عنوان الحصة - مثلا: حصة يونت 1">
<input id="meetLink" placeholder="لينك جوجل ميت https://meet.google.com/...">
<input id="ytLink" placeholder="لينك يوتيوب (اختياري)">
<textarea id="lessonDesc" placeholder="ملاحظات"></textarea>
<select id="lessonGrade"><option>الصف الثالث الثانوي</option><option>الصف الثاني</option><option>الصف الأول</option><option>للكل</option></select>
<button onclick="addLesson()" style="background:#10b981">نشر الحصة الآن</button>
</div>
<h4>الطلاب المنتظرين</h4><div id="pendingList"></div>
<h4>الطلاب المقبولين</h4><div id="approvedList"></div>
<h4>الحصص المنشورة</h4><div id="adminLessons"></div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyA3EUyPGWQXi3yEV50QYYCtCASKV-MEE5I",
  authDomain: "ahmed-elsayed-bf13d.firebaseapp.com",
  projectId: "ahmed-elsayed-bf13d",
  storageBucket: "ahmed-elsayed-bf13d.firebasestorage.app",
  messagingSenderId: "66067955169",
  appId: "1:66067955169:web:28330bd439b6fd4c73e6a0"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.showTab = (t)=>{
 document.querySelectorAll('[id^=tab-]').forEach(e=>e.style.display='none');
 document.getElementById('tab-'+t).style.display='block';
 document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
 const m={student:0,register:1,admin:2}; document.querySelectorAll('.tab')[m[t]].classList.add('active');
}
window.registerStudent = async ()=>{
 const name=document.getElementById('name').value.trim();
 const phone=document.getElementById('phone').value.trim();
 const parentPhone=document.getElementById('parentPhone').value.trim();
 const grade=document.getElementById('grade').value;
 if(!name||!phone){alert('اكمل البيانات');return}
 await addDoc(collection(db,'students'),{name,phone,parentPhone,grade,status:'pending',created:Date.now()});
 document.getElementById('regMsg').innerHTML='✅ تم التسجيل انتظر موافقة المستر';
}
window.loginStudent = async ()=>{
 const phone=document.getElementById('loginPhone').value.trim();
 const q=query(collection(db,'students'),where('phone','==',phone));
 const snap=await getDocs(q);
 if(snap.empty){document.getElementById('loginMsg').innerText='❌ الرقم مش متسجل';return}
 const data=snap.docs[0].data();
 if(data.status!=='approved'){document.getElementById('loginMsg').innerText='⏳ لسه موافقناش';return}
 document.getElementById('studentArea').style.display='block';
 document.getElementById('welcome').innerText=`أهلا يا ${data.name} ❤️`;
 loadLessonsForStudent();
}
async function loadLessonsForStudent(){
 const snap=await getDocs(collection(db,'lessons'));
 let html=''; snap.forEach(d=>{
  const l=d.data();
  html+=`<div class='lesson'><h3>${l.title}</h3><p>${l.desc||''}</p><small>${l.grade}</small><br>
  ${l.meetLink?`<a class='meetBtn' target='_blank' href='${l.meetLink}'>🎥 ادخل جوجل ميت الآن</a>`:''}
  ${l.ytLink?`<a class='ytBtn' target='_blank' href='${l.ytLink}'>▶️ شاهد على يوتيوب</a>`:''}
  </div>`;
 });
 document.getElementById('lessonsList').innerHTML=html||'<p>لا يوجد حصص حاليا</p>';
}
window.loginAdmin = async ()=>{
 if(document.getElementById('adminPass').value!=='12345'){alert('غلط');return}
 document.getElementById('adminArea').style.display='block'; loadAdmin(); loadAdminLessons();
}
async function loadAdmin(){
 const snap=await getDocs(collection(db,'students'));
 const pending=document.getElementById('pendingList');const approved=document.getElementById('approvedList');
 pending.innerHTML='';approved.innerHTML='';
 snap.forEach(d=>{
  const s=d.data(); const id=d.id;
  const row=`<div style='display:flex;justify-content:space-between;background:#0f172a;padding:10px;border-radius:10px;margin-top:8px'><div><b>${s.name}</b> - ${s.phone}<br><small>${s.grade}</small></div>
  ${s.status=='pending'?`<button onclick="approve('${id}')" style='width:auto;background:#10b981'>موافقة</button>`:`<span>✅</span>`}</div>`;
  if(s.status=='pending') pending.innerHTML+=row; else approved.innerHTML+=row;
 });
}
window.approve = async (id)=>{ await updateDoc(doc(db,'students',id),{status:'approved'}); loadAdmin(); }
window.addLesson = async ()=>{
 const title=document.getElementById('lessonTitle').value;
 const meetLink=document.getElementById('meetLink').value;
 const ytLink=document.getElementById('ytLink').value;
 const desc=document.getElementById('lessonDesc').value;
 const grade=document.getElementById('lessonGrade').value;
 if(!title){alert('اكتب عنوان الحصة');return}
 await addDoc(collection(db,'lessons'),{title,meetLink,ytLink,desc,grade,created:Date.now()});
 alert('تم نشر الحصة!'); loadAdminLessons();
}
async function loadAdminLessons(){
 const snap=await getDocs(collection(db,'lessons'));
 let html=''; snap.forEach(d=>{
  const l=d.data();
  html+=`<div class='lesson'><b>${l.title}</b> - ${l.meetLink}<br><button onclick="delLesson('${d.id}')" style='background:#ef4444;width:auto'>حذف</button></div>`;
 });
 document.getElementById('adminLessons').innerHTML=html;
}
window.delLesson = async (id)=>{ await deleteDoc(doc(db,'lessons',id)); loadAdminLessons(); }
</script>
</body>
</html>

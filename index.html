<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة مستر أحمد السيد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:20px;text-align:center}
.sub-banner{background:#f59e0b;color:#000;padding:12px 15px;border-radius:12px;margin-top:12px;font-weight:900;font-size:14px;display:inline-block;line-height:1.6}
.container{max-width:900px;margin:auto;padding:15px}.card{background:#1e293b;border-radius:16px;padding:20px;margin-bottom:15px}
input,select,button,textarea{width:100%;padding:12px;border-radius:10px;border:none;margin-top:10px;font-size:15px}
input,select,textarea{background:#0f172a;color:#fff;border:1px solid #334155}
button{background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}
.tab{flex:1;text-align:center;padding:12px;background:#1e293b;border-radius:10px;cursor:pointer;font-size:13px}
.tab.active{background:#4f46e5}.tabs{display:flex;gap:6px;margin-bottom:15px}
.lesson{background:#0f172a;border:1px solid #334155;padding:18px;border-radius:12px;margin-top:12px;text-align:center}
.meetBtn{background:#10b981;display:block;text-decoration:none;padding:14px;border-radius:10px;color:#fff;font-weight:900;font-size:18px;margin-top:10px}
.student-row{display:flex;justify-content:space-between;align-items:center;background:#0f172a;padding:12px;border-radius:10px;margin-top:10px;gap:8px;flex-wrap:wrap}
.btn-small{width:auto;padding:6px 12px;font-size:12px;border-radius:8px}
</style>
</head>
<body>
<header>
<h1>منصة مستر أحمد السيد 📚</h1>
<p>من الأول الابتدائي للثالث الإعدادي</p>
<div class="sub-banner">
📞 للاشتراك يرجي ارسال سعر الحصه انستا أو اتصالات كاش<br>
<a href="https://wa.me/201116811324?text=السلام%20عليكم%20يا%20مستر%20احمد%20عايز%20اشترك%20في%20المنصة" target="_blank" style="color:#000;text-decoration:none;font-weight:900;font-size:18px;background:#fff;padding:6px 18px;border-radius:25px;display:inline-block;margin-top:8px">📲 01116811324 - دوس للواتساب</a>
</div>
</header>

<div class="container">
<div class="tabs">
<div class="tab active" onclick="showTab('student')">دخول الطلاب</div>
<div class="tab" onclick="showTab('register')">تسجيل</div>
<div class="tab" onclick="showTab('admin')">لوحة المستر</div>
</div>

<div id="tab-register" class="card" style="display:none">
<h3>تسجيل طالب جديد</h3>
<input id="name" placeholder="الاسم ثلاثي">
<input id="phone" placeholder="رقم الواتساب">
<input id="parentPhone" placeholder="رقم ولي الأمر">
<select id="grade"><option>الصف الأول الابتدائي</option><option>الصف الثاني الابتدائي</option><option>الصف الثالث الابتدائي</option><option>الصف الرابع الابتدائي</option><option>الصف الخامس الابتدائي</option><option>الصف السادس الابتدائي</option><option>الصف الأول الإعدادي</option><option>الصف الثاني الإعدادي</option><option>الصف الثالث الإعدادي</option></select>
<button onclick="registerStudent()">تسجيل</button><p id="regMsg"></p>
</div>

<div id="tab-student" class="card">
<h3>دخول الطالب</h3>
<input id="loginPhone" placeholder="رقم الواتساب">
<button onclick="loginStudent()">دخول</button><p id="loginMsg"></p>
<div id="studentArea" style="display:none"><h2 id="welcome"></h2><div id="lessonsList"></div></div>
</div>

<div id="tab-admin" class="card" style="display:none">
<h3>لوحة المستر 🔒</h3>
<input id="adminPass" type="password" placeholder="Ahmed@salwa2020">
<button onclick="loginAdmin()">دخول</button>
<div id="adminArea" style="display:none">
<div class="card" style="background:#0f172a;border:2px solid #10b981">
<h4>🔴 تحديث لينك الحصة (واحد بس ظاهر)</h4>
<input id="lessonTitle" placeholder="عنوان الحصة">
<input id="meetLink" placeholder="لينك جوجل ميت">
<input id="ytLink" placeholder="يوتيوب اختياري">
<select id="lessonGrade"><option>للكل</option><option>الصف الأول الابتدائي</option><option>الصف الثاني الابتدائي</option><option>الصف الثالث الابتدائي</option><option>الصف الرابع الابتدائي</option><option>الصف الخامس الابتدائي</option><option>الصف السادس الابتدائي</option><option>الصف الأول الإعدادي</option><option>الصف الثاني الإعدادي</option><option>الصف الثالث الإعدادي</option></select>
<button onclick="addLesson()" style="background:#10b981">✅ نشر</button>
</div>
<h4>المنتظرين</h4><div id="pendingList"></div>
<h4>المقبولين - تقدر تحذف اللي مدفعش</h4><div id="approvedList"></div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, setDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyA3EUyPGWQXi3yEV50QYYCtCASKV-MEE5I",
  authDomain: "ahmed-elsayed-bf13d.firebaseapp.com",
  projectId: "ahmed-elsayed-bf13d",
  storageBucket: "ahmed-elsayed-bf13d.firebasestorage.app",
  messagingSenderId: "66067955169",
  appId: "1:66067955169:web:28330bd439b6fd4c73e6a0"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.showTab = (t)=>{
 document.querySelectorAll('[id^=tab-]').forEach(e=>e.style.display='none');
 document.getElementById('tab-'+t).style.display='block';
 document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
 const m={student:0,register:1,admin:2}; document.querySelectorAll('.tab')[m[t]].classList.add('active');
}
window.registerStudent = async ()=>{
 const name=document.getElementById('name').value.trim();
 const phone=document.getElementById('phone').value.trim();
 const parentPhone=document.getElementById('parentPhone').value.trim();
 const grade=document.getElementById('grade').value;
 if(!name||!phone){alert('اكمل البيانات');return}
 await addDoc(collection(db,'students'),{name,phone,parentPhone,grade,status:'pending',created:Date.now()});
 document.getElementById('regMsg').innerHTML='✅ تم التسجيل!';
}
window.loginStudent = async ()=>{
 const loginMsg=document.getElementById('loginMsg');
 const studentArea=document.getElementById('studentArea');
 const welcome=document.getElementById('welcome');
 const lessonsList=document.getElementById('lessonsList');
 studentArea.style.display='none'; welcome.innerText=''; lessonsList.innerHTML=''; loginMsg.innerText='';
 const phone=document.getElementById('loginPhone').value.trim();
 if(!phone){loginMsg.innerText='اكتب الرقم';return}
 const q=query(collection(db,'students'),where('phone','==',phone));
 const snap=await getDocs(q);
 if(snap.empty){loginMsg.innerText='❌ الرقم مش متسجل'; return}
 const data=snap.docs[0].data();
 if(data.status!=='approved'){loginMsg.innerText='⏳ لسه موافقناش عليك'; return}
 studentArea.style.display='block';
 welcome.innerText=`أهلا يا ${data.name} ❤️`;
 const snapL=await getDocs(collection(db,'lessons'));
 let html=''; snapL.forEach(d=>{
  const l=d.data();
  html=`<div class='lesson'><h2>${l.title}</h2><p>${l.grade}</p><a class='meetBtn' target='_blank' href='${l.meetLink}'>🎥 ادخل جوجل ميت الآن</a>${l.ytLink?`<br><a style='color:#f87171' target='_blank' href='${l.ytLink}'>شاهد يوتيوب</a>`:''}</div>`;
 });
 document.getElementById('lessonsList').innerHTML=html||'<p>لا يوجد حصة حالية</p>';
}
window.loginAdmin = async ()=>{
 if(document.getElementById('adminPass').value!=='Ahmed@salwa2020'){alert('الباسورد غلط');return}
 document.getElementById('adminArea').style.display='block'; loadAdmin();
}
async function loadAdmin(){
 const snap=await getDocs(collection(db,'students'));
 const pending=document.getElementById('pendingList');const approved=document.getElementById('approvedList');
 pending.innerHTML='';approved.innerHTML='';
 snap.forEach(d=>{
  const s=d.data(); const id=d.id;
  if(s.status=='pending'){
   pending.innerHTML+=`<div class="student-row"><div><b>⏳ ${s.name}</b> - ${s.phone}<br><small>${s.grade}</small></div><div style="display:flex;gap:5px"><button class="btn-small" onclick="approve('${id}')" style="background:#10b981">✔️ موافقة</button><button class="btn-small" onclick="deleteStudent('${id}')" style="background:#ef4444">🗑️ حذف</button></div></div>`;
  } else {
   approved.innerHTML+=`<div class="student-row"><div><b>✅ ${s.name}</b> - ${s.phone}<br><small>${s.grade}</small></div><div style="display:flex;gap:5px"><span style="color:#10b981">✔️</span><button class="btn-small" onclick="blockStudent('${id}')" style="background:#f59e0b">🚫 حظر</button><button class="btn-small" onclick="deleteStudent('${id}')" style="background:#ef4444">🗑️ مسح</button></div></div>`;
  }
 });
}
window.approve = async (id)=>{ await updateDoc(doc(db,'students',id),{status:'approved'}); loadAdmin(); }
window.blockStudent = async (id)=>{ if(!confirm('هتحظر الطالب ده؟')) return; await updateDoc(doc(db,'students',id),{status:'pending'}); loadAdmin(); }
window.deleteStudent = async (id)=>{ if(!confirm('متأكد هتمسح الطالب نهائيا؟')) return; await deleteDoc(doc(db,'students',id)); loadAdmin(); }
window.addLesson = async ()=>{
 const title=document.getElementById('lessonTitle').value;
 const meetLink=document.getElementById('meetLink').value;
 const ytLink=document.getElementById('ytLink').value;
 const grade=document.getElementById('lessonGrade').value;
 if(!title||!meetLink){alert('اكتب العنوان واللينك');return}
 await setDoc(doc(db,'lessons','current'),{title,meetLink,ytLink,grade,created:Date.now()});
 alert('تم النشر');
}
</script>
</body>
</html>

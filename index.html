<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة مستر أحمد</title>
<style>body{font-family:system-ui;background:#f5f7ff;margin:0}.card{max-width:420px;margin:20px auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 20px rgba(0,0,0,.06)}input,select{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid #ddd;box-sizing:border-box}.btn{width:100%;padding:14px;background:#5b5bf6;color:#fff;border:0;border-radius:12px;font-weight:bold;margin-top:8px;cursor:pointer}.codeBox{background:#0f172a;color:#22c55e;padding:14px;border-radius:12px;text-align:center;font-size:22px;font-weight:bold;letter-spacing:1px;margin:12px 0}</style>
</head>
<body>
<div class="card" id="login">
<h2 style="text-align:center">📚 منصة مستر أحمد</h2>
<p style="text-align:center;color:#666">سجل مرة واحدة وهيتعملك كود خاص بيك</p>
<input id="name" placeholder="اسمك ثلاثي">
<input id="phone" placeholder="رقم الواتساب 01xxxxxxxxx">
<select id="grade"><option value="">اختر صفك</option><option>1 اعدادي</option><option>2 اعدادي</option><option>3 اعدادي</option><option>1 ثانوي</option><option>2 ثانوي</option><option>3 ثانوي</option></select>
<button class="btn" onclick="reg()">تسجيل وانشاء كودي</button>
</div>
<div class="card" id="home" style="display:none">
<h3>أهلا يا <span id="n"></span> 👋</h3>
<p>ده كودك الخاص الثابت، كل طالب كوده مختلف:</p>
<div class="codeBox" id="myCode"></div>
<button class="btn" style="background:#e11d48" onclick="location.href='live.html'">🔴 دخول الحصة لايف</button>
<button class="btn" style="background:#fff;color:#5b5bf6;border:2px solid #5b5bf6" onclick="navigator.clipboard.writeText(document.getElementById('myCode').innerText);alert('اتنسخ')">📋 نسخ الكود</button>
</div>
<script>
function genCode(p){return `EN-${p.slice(-4)}-${Math.floor(1000+Math.random()*9000)}`;}
function reg(){
let nm=document.getElementById('name').value.trim();
let ph=document.getElementById('phone').value.trim();
let gr=document.getElementById('grade').value;
if(!nm||ph.length<11){alert('اكمل بياناتك');return}
let code=localStorage.getItem('st_code'); if(!code){code=genCode(ph); localStorage.setItem('st_code',code);}
localStorage.setItem('st_name',nm); localStorage.setItem('st_phone',ph); localStorage.setItem('st_grade',gr);
show();
}
function show(){
let nm=localStorage.getItem('st_name'); let cd=localStorage.getItem('st_code');
if(!nm) return; document.getElementById('login').style.display='none'; document.getElementById('home').style.display='block';
document.getElementById('n').innerText=nm.split(' ')[0]; document.getElementById('myCode').innerText=cd;
}
show();
</script>
</body>
</html>

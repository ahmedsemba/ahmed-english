<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة مستر أحمد السيد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',sans-serif;box-sizing:border-box}
body{margin:0;background:#0f172a;color:#fff;min-height:100vh}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);padding:20px;text-align:center}
.container{max-width:900px;margin:auto;padding:20px}
.card{background:#1e293b;border-radius:16px;padding:20px;margin-bottom:20px}
input,select,button{width:100%;padding:12px;border-radius:10px;border:none;margin-top:10px;font-size:16px}
input,select{background:#0f172a;color:#fff;border:1px solid #334155}
button{background:#4f46e5;color:#fff;font-weight:700;cursor:pointer}
.tab{flex:1;text-align:center;padding:12px;background:#1e293b;border-radius:10px;cursor:pointer}
.tab.active{background:#4f46e5}
.tabs{display:flex;gap:10px;margin-bottom:15px}
.student-row{display:flex;justify-content:space-between;align-items:center;background:#0f172a;padding:12px;border-radius:10px;margin-top:10px;gap:10px;flex-wrap:wrap}
.badge{padding:4px 10px;border-radius:20px;font-size:12px}
.pending{background:#f59e0b;color:#000}.approved{background:#10b981}
</style>
</head>
<body>
<header><h1>منصة مستر أحمد السيد 📚</h1><p>الموقع الرسمي - سجل وانتظر الموافقة</p></header>
<div class="container">
<div class="tabs">
<div class="tab active" onclick="showTab('student')">دخول الطلاب</div>
<div class="tab" onclick="showTab('register')">تسجيل جديد</div>
<div class="tab" onclick="showTab('admin')">لوحة المستر</div>
</div>
<div id="tab-register" class="card" style="display:none">
<h3>تسجيل طالب جديد</h3>
<input id="name" placeholder="اسم الطالب ثلاثي">
<input id="phone" placeholder="رقم الواتساب">
<input id="parentPhone" placeholder="رقم ولي الأمر">
<select id="grade"><option>الصف الثالث الثانوي</option><option>الصف الثاني الثانوي</option><option>الصف الأول الثانوي</option></select>
<button onclick="registerStudent()">تسجيل الآن</button>
<p id="regMsg"></p>
</div>
<div id="tab-student" class="card">
<h3>دخول الطالب</h3>
<input id="loginPhone" placeholder="اكتب رقم الواتساب اللي سجلت بيه">
<button onclick="loginStudent()">دخول</button>
<p id="loginMsg"></p>
<div id="studentArea" style="display:none">
<h2 id="welcome"></h2>
<div id="lessons"><div class="card"><h4>📖 أهلا بيك</h4><p>هنا هتضيف فيديوهاتك بعدين</p></div></div>
</div>
</div>
<div id="tab-admin" class="card" style="display:none">
<h3>لوحة تحكم المستر 🔒</h3>
<input id="adminPass" type="password" placeholder="كلمة السر (12345)">
<button onclick="loginAdmin()">دخول اللوحة</button>
<div id="adminArea" style="display:none;margin-top:15px">
<h4>الطلاب المنتظرين</h4><div id="pendingList"></div>
<h4>الطلاب المقبولين</h4><div id="approvedList"></div>
</div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyA3EUyPGWQXi3yEV50QYYCtCASKV-MEE5I",
  authDomain: "ahmed-elsayed-bf13d.firebaseapp.com",
  projectId: "ahmed-elsayed-bf13d",
  storageBucket: "ahmed-elsayed-bf13d.firebasestorage.app",
  messagingSenderId: "66067955169",
  appId: "1:66067955169:web:28330bd439b6fd4c73e6a0",
  measurementId: "G-4Q3GY9THNS"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
window.showTab = (t)=>{
 document.querySelectorAll('[id^=tab-]').forEach(e=>e.style.display='none');
 document.getElementById('tab-'+t).style.display='block';
 document.querySelectorAll('.tab').forEach(e=>e.classList.remove('active'));
 if(t=='student') document.querySelectorAll('.tab')[0].classList.add('active');
 if(t=='register') document.querySelectorAll('.tab')[1].classList.add('active');
 if(t=='admin') document.querySelectorAll('.tab')[2].classList.add('active');
}
window.registerStudent = async ()=>{
 const name=document.getElementById('name').value.trim();
 const phone=document.getElementById('phone').value.trim();
 const parentPhone=document.getElementById('parentPhone').value.trim();
 const grade=document.getElementById('grade').value;
 if(!name||!phone){alert('اكمل البيانات');return}
 await addDoc(collection(db,'students'),{name,phone,parentPhone,grade,status:'pending',created:Date.now()});
 document.getElementById('regMsg').innerHTML='✅ تم التسجيل! انتظر موافقة المستر';
}
window.loginStudent = async ()=>{
 const phone=document.getElementById('loginPhone').value.trim();
 const q=query(collection(db,'students'),where('phone','==',phone));
 const snap=await getDocs(q);
 if(snap.empty){document.getElementById('loginMsg').innerText='❌ الرقم مش متسجل';return}
 const data=snap.docs[0].data();
 if(data.status!=='approved'){document.getElementById('loginMsg').innerText='⏳ لسه المستر موافقش عليك';return}
 document.getElementById('studentArea').style.display='block';
 document.getElementById('welcome').innerText=`أهلا يا ${data.name} ❤️`;
}
window.loginAdmin = async ()=>{
 if(document.getElementById('adminPass').value!=='12345'){alert('الباسورد غلط');return}
 document.getElementById('adminArea').style.display='block';
 loadAdmin();
}
async function loadAdmin(){
 const snap=await getDocs(collection(db,'students'));
 const pending=document.getElementById('pendingList');const approved=document.getElementById('approvedList');
 pending.innerHTML='';approved.innerHTML='';
 snap.forEach(d=>{
  const s=d.data();const id=d.id;
  const row=`<div class='student-row'><div><b>${s.name}</b> - ${s.phone} <span class='badge ${s.status}'>${s.status}</span><br><small>${s.grade}</small></div>
  ${s.status=='pending'?`<button onclick="approve('${id}')" style='width:auto;padding:8px 15px;background:#10b981'>موافقة ✅</button>`:`<span>مقبول ✅</span>`}</div>`;
  if(s.status=='pending') pending.innerHTML+=row; else approved.innerHTML+=row;
 });
}
window.approve = async (id)=>{
 await updateDoc(doc(db,'students',id),{status:'approved'});
 loadAdmin();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة مستر أحمد</title>
<style>body{font-family:Tahoma;background:#f1f5f9;padding:15px}.card{background:white;max-width:400px;margin:30px auto;padding:20px;border-radius:15px}input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}button{border:none;font-weight:bold;cursor:pointer}.tabs{display:flex;gap:8px}.tabs button{flex:1;background:#e2e8f0}.active{background:#0ea5e9!important;color:white}.hide{display:none}</style>
</head>
<body>
<div class="card">
<h3 style="text-align:center">منصة مستر أحمد - English</h3>
<div class="tabs">
<button id="b1" class="active" onclick="showTab('reg')">تسجيل جديد</button>
<button id="b2" onclick="showTab('log')">دخول</button>
</div>
<div id="reg">
<input id="name" placeholder="الاسم ثلاثي">
<input id="phone" placeholder="رقم الطالب 01xxxxxxxxx">
<input id="parentPhone" placeholder="رقم ولي الأمر">
<select id="grade"><option>1 ابتدائي</option><option>2 ابتدائي</option><option>3 ابتدائي</option><option>4 ابتدائي</option><option>5 ابتدائي</option><option>6 ابتدائي</option><option>1 اعدادي</option><option>2 اعدادي</option><option>3 اعدادي</option></select>
<input id="pass" placeholder="باسورد انجليزي">
<button style="background:#22c55e;color:white" onclick="reg()" id="rBtn">تسجيل ودخول للملازم المجانية</button>
</div>
<div id="log" class="hide">
<input id="l_phone" placeholder="رقمك 01xxxxxxxxx">
<input id="l_pass" type="password" placeholder="الباسورد">
<button style="background:#0ea5e9;color:white" onclick="loginStudent()" id="lBtn">دخول للملازم</button>
<p id="lMsg" style="text-align:center;font-size:13px;color:red"></p>
<hr>
<input id="adminU" placeholder="admin">
<input id="adminP" type="password" placeholder="باسورد الادمن Ahmed@2020#">
<button style="background:#0f172a;color:white" onclick="adminLogin()">دخول كأدمن (رفع ومسح)</button>
</div>
</div>
<script>
const URL="https://script.google.com/macros/s/AKfycbw3tS1p1G7srl_kZD3VH1wl24syiafZkJIN8HeOHepjjQYwf-cMrgglcO6eG1S1UusP/exec";
function showTab(t){document.getElementById('reg').classList.toggle('hide',t!='reg');document.getElementById('log').classList.toggle('hide',t!='log');document.getElementById('b1').classList.toggle('active',t=='reg');document.getElementById('b2').classList.toggle('active',t=='log');}
async function reg(){let d={action:'register',name:name.value.trim(),phone:phone.value.trim(),parentPhone:parentPhone.value.trim(),grade:grade.value,password:pass.value.trim()};if(!d.name||!d.phone||!d.password) return alert('كمل البيانات');rBtn.innerText='جاري...';await fetch(URL,{method:'POST',mode:'no-cors',body:JSON.stringify(d)});localStorage.setItem('student_name',d.name);localStorage.setItem('isAdmin','0');location.href='dashboard.html';}
async function loginStudent(){let ph=l_phone.value.trim(), ps=l_pass.value.trim();if(!ph||!ps) return alert('اكتب رقمك والباسورد');lBtn.innerText='جاري التحقق...';let r=await fetch(URL+'?action=login&phone='+encodeURIComponent(ph)+'&password='+encodeURIComponent(ps));let j=await r.json();if(j.found){localStorage.setItem('student_name',j.name);localStorage.setItem('isAdmin','0');location.href='dashboard.html';}else{lMsg.innerText='❌ رقم او باسورد غلط';lBtn.innerText='دخول للملازم';}}
function adminLogin(){if(adminU.value=='admin'&&adminP.value=='Ahmed@2020#'){localStorage.setItem('student_name','مستر أحمد');localStorage.setItem('isAdmin','1');location.href='dashboard.html';}else alert('غلط');}
</script>
</body>
</html>

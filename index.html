<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة مستر احمد</title>
<style>body{font-family:Tahoma;background:#f1f5f9;padding:20px}.card{background:#fff;max-width:380px;margin:auto;padding:20px;border-radius:15px}input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}button{background:#22c55e;color:#fff;font-weight:bold;border:none;font-size:16px}</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center">منصة مستر احمد</h2>
<input id="n" placeholder="اسمك - سما احمد محمد">
<input id="p" placeholder="رقمك - 01095558173">
<button onclick="go()">دخول للملازم فورا</button>
<p style="text-align:center;margin-top:10px"><a href="#" onclick="admin()">دخول كأدمن</a></p>
</div>
<script>
function go(){
 if(!n.value){alert('اكتب اسمك');return;}
 localStorage.setItem('student_name',n.value);
 localStorage.setItem('isAdmin','0');
 location.href='dashboard.html';
}
function admin(){
 let u=prompt('يوزر الادمن'); let ps=prompt('باسورد الادمن');
 if(u=='admin' && ps=='Ahmed@2020#'){
   localStorage.setItem('student_name','مستر احمد');
   localStorage.setItem('isAdmin','1');
   location.href='dashboard.html';
 } else alert('غلط');
}
</script>
</body>
</html>

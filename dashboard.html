<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الطالب - مستر أحمد</title>
<style>
body{font-family:Tahoma, Arial;background:#eef2ff;margin:0;padding:15px}
.box{background:white;max-width:500px;margin:20px auto;padding:25px;border-radius:20px;box-shadow:0 8px 20px rgba(0,0,0,0.1);text-align:center}
h2{color:#1f2937;margin-bottom:5px}
p{color:#6b7280;margin-top:0}
a.btn{display:block;padding:16px;margin:12px 0;border-radius:12px;text-decoration:none;font-weight:bold;font-size:16px;transition:0.2s}
a.live{background:#22c55e;color:white;box-shadow:0 4px 10px rgba(34,197,94,0.3)}
a.live:hover{background:#16a34a}
a.mz{background:#007bff;color:white}
a.vid{background:#8b5cf6;color:white}
a.out{background:#fee2e2;color:#dc2626;margin-top:25px}
.badge{display:inline-block;background:#dcfce7;color:#166534;padding:4px 10px;border-radius:20px;font-size:12px;margin-bottom:10px}
</style>
</head>
<body>
<div class="box">
<div class="badge">● أونلاين الآن</div>
<h2 id="welcome">أهلا</h2>
<p>منصة مستر أحمد للإنجليزي</p>

<a class="btn live" href="live.html?room=grade1">🔴 دخول الحصة المباشرة الآن</a>
<a class="btn mz" href="#">📚 مذكراتي PDF</a>
<a class="btn vid" href="#">🎥 فيديوهاتي المسجلة</a>

<a class="btn out" href="index.html" onclick="localStorage.clear()">تسجيل خروج</a>
</div>

<script>
// يجيب اسم الطالب اللي سجل دخول
let name = localStorage.getItem('student_name');
if(!name){
  // لو مش مسجل دخول يرجعه لصفحة الدخول
  location.href='index.html';
} else {
  document.getElementById('welcome').innerHTML = 'أهلا يا ' + name + ' 👋';
}
</script>
</body>
</html>

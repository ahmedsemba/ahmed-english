<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الملازم</title>
<style>body{font-family:Tahoma;background:#f1f5f9;margin:0;padding:10px}.box{background:white;max-width:700px;margin:10px auto;padding:15px;border-radius:12px}.admin{background:#0f172a;color:white;display:none}button{padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.gradeBtn{padding:8px 12px;margin:4px;border-radius:20px;border:1px solid #ddd;background:white;cursor:pointer}.gradeBtn.active{background:#0ea5e9;color:white}.fileCard{display:flex;justify-content:space-between;align-items:center;background:#f8fafc;border:1px solid #eee;padding:10px;border-radius:10px;margin:6px 0}</style>
</head>
<body>
<div id="adminArea" class="box admin">
<h3>👨‍🏫 لوحة تحكمك يا مستر</h3>
<button onclick="document.getElementById('up').style.display='block'" style="background:#38bdf8;color:black;width:100%">📤 ارفع ملزمة جديدة من موبايلك</button>
<div id="up" style="display:none;margin-top:10px;border:1px dashed #555;padding:10px;border-radius:10px">
<select id="upGrade"><option>1 ابتدائي</option><option>2 ابتدائي</option><option>3 ابتدائي</option><option>4 ابتدائي</option><option>5 ابتدائي</option><option>6 ابتدائي</option><option>1 اعدادي</option><option>2 اعدادي</option><option>3 اعدادي</option></select>
<select id="upTerm"><option>الترم الاول</option><option>الترم التاني</option></select>
<select id="upType"><option>شرح</option><option>امتحانات</option></select>
<input type="file" id="fileInput"><input id="fileName" placeholder="اسم الملف">
<button style="background:#22c55e;color:white;width:100%" onclick="upload()" id="upBtn">رفع الآن</button><p id="upMsg" style="font-size:12px"></p>
</div>
<hr>
<button onclick="askPass()" style="background:#334155;color:white;width:100%">🔒 اظهار بيانات الطلبة (سري)</button>
<div id="students" style="display:none;margin-top:10px"></div>
<hr>
<input id="room" value="AhmedEnglish_Live"><button style="background:#22c55e;color:white;width:100%" onclick="startLive()">🎥 ابدأ لايف كمدرس</button>
</div>

<div class="box">
<h2>📚 الملازم المجانية - صدقة جارية</h2>
<div id="grades"></div>
<div style="margin:10px 0"><button id="btnT1" class="gradeBtn active" onclick="setTerm('الترم الاول')">الترم الاول</button><button id="btnT2" class="gradeBtn" onclick="setTerm('الترم التاني')">الترم التاني</button> | <button id="btnS1" class="gradeBtn active" onclick="setType('شرح')">شرح</button><button id="btnS2" class="gradeBtn" onclick="setType('امتحانات')">امتحانات</button></div>
<div id="files">اختار الصف فوق 👆</div>
</div>

<div class="box" style="border:2px solid #22c55e">
<h3>🔴 دخول الحصة اللايف بكود</h3>
<input id="code" placeholder="كودك EN..."><button style="background:#22c55e;color:white;width:100%" onclick="enterLive()">دخول اللايف</button><p id="msg" style="text-align:center;font-size:13px"></p>
</div>

<script>
const URL="https://script.google.com/macros/s/AKfycbw3tS1p1G7srl_kZD3VH1wl24syiafZkJIN8HeOHepjjQYwf-cMrgglcO6eG1S1UusP/exec";
let curGrade="1 ابتدائي", curTerm="الترم الاول", curType="شرح", allFiles=[], isAdmin=localStorage.getItem('isAdmin')=='1';
if(isAdmin) document.getElementById('adminArea').style.display='block';
const grades=["1 ابتدائي","2 ابتدائي","3 ابتدائي","4 ابتدائي","5 ابتدائي","6 ابتدائي","1 اعدادي","2 اعدادي","3 اعدادي"];
document.getElementById('grades').innerHTML=grades.map(g=>`<button class="gradeBtn ${g==curGrade?'active':''}" onclick="setGrade('${g}')">${g}</button>`).join('');
function setGrade(g){curGrade=g; document.querySelectorAll('#grades .gradeBtn').forEach(b=>b.classList.toggle('active',b.textContent==g)); render();}
function setTerm(t){curTerm=t; btnT1.classList.toggle('active',t=='الترم الاول'); btnT2.classList.toggle('active',t=='الترم التاني'); render();}
function setType(tp){curType=tp; btnS1.classList.toggle('active',tp=='شرح'); btnS2.classList.toggle('active',tp=='امتحانات'); render();}
async function loadFiles(){let r=await fetch(URL+'?action=getFiles'); allFiles=await r.json(); render();}
function render(){let f=allFiles.filter(x=>x.grade==curGrade && x.term==curTerm && x.type==curType); let h=f.length?'' : '<p style=color:#888>مفيش ملازم هنا لسه</p>'; f.forEach(file=>{h+=`<div class="fileCard"><div><b>${file.name}</b><br><small>${file.grade} - ${file.term} - ${file.type}</small></div><div style="display:flex;gap:5px"><a href="${file.url}" target="_blank"><button style="background:#0ea5e9;color:white">تحميل</button></a>${isAdmin?`<button style="background:#ef4444;color:white" onclick="delFile(${file.row})">مسح</button>`:''}</div></div>`}); document.getElementById('files').innerHTML=h;}
async function upload(){let file=fileInput.files[0], name=fileName.value.trim(); if(!file||!name) return alert('اختار ملف واكتب اسم'); upBtn.innerText='جاري الرفع...'; let reader=new FileReader(); reader.onload=async e=>{let base64=e.target.result.split(',')[1]; await fetch(URL,{method:'POST',body:JSON.stringify({action:'uploadFile',grade:upGrade.value,term:upTerm.value,fileType:upType.value,fileName:name,file:base64,mime:file.type})}); upMsg.innerText='✅ اترفعت'; upBtn.innerText='رفع الآن'; loadFiles();}; reader.readAsDataURL(file);}
async function delFile(row){if(!confirm('تمسح؟')) return; await fetch(URL,{method:'POST',body:JSON.stringify({action:'deleteFile',row:row})}); loadFiles();}
function askPass(){let p=prompt('الباسورد السري:'); if(p=='AhmedPrivate#'){students.style.display='block'; loadStudents();} else alert('غلط');}
async function loadStudents(){let r=await fetch(URL+'?action=getStudents'); let list=await r.json(); let h=''; list.reverse().forEach(s=>{h+=`<div style="background:#1e293b;padding:8px;border-radius:8px;margin:6px 0;font-size:12px"><b>${s.name}</b> ${s.phone}<br>${s.grade} - <b style="color:#22c55e">${s.code||'مفيش كود'}</b><br><button style="background:#22c55e;color:white;width:100%;margin-top:4px" onclick="approve(${s.row},'${s.phone}')">طلع كود مختلف / غيره</button></div>`}); students.innerHTML=h;}
async function approve(row,phone){let r=await fetch(URL,{method:'POST',body:JSON.stringify({action:'approve',row:row})}); let j=await r.json(); alert('الكود المختلف: '+j.code); window.open('https://wa.me/2'+phone+'?text=كود اللايف: '+j.code,'_blank'); loadStudents();}
function startLive(){let roomVal=document.getElementById('room').value; window.open('https://meet.ffmuc.net/'+roomVal+'#userInfo.displayName="مستر احمد"','_blank');}
function enterLive(){let c=document.getElementById('code').value.trim(); if(!c) return; fetch(URL+'?action=check&code='+encodeURIComponent(c)).then(r=>r.json()).then(j=>{if(j.found) location.href='live.html?room='+document.getElementById('room').value+'&code='+c; else document.getElementById('msg').innerText='❌ الكود غلط';});}
loadFiles();
</script>
</body>
</html>

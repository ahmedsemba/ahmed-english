<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الحصة لايف</title>
<script src='https://meet.ffmuc.net/external_api.js'></script>
<style>body{margin:0;font-family:Tahoma;background:#111;color:white}#top{padding:10px;background:#1f2937;display:flex;gap:8px;flex-wrap:wrap}button{padding:8px 12px;border-radius:8px;border:none;background:#007bff;color:white;font-weight:bold;cursor:pointer}input{flex:1;padding:8px;border-radius:8px;border:none;min-width:150px}#meet{height:calc(100vh - 55px)}</style>
</head>
<body>
<div id="top">
<span id="s">جاري التحميل...</span>
<input id="pdf" placeholder="لينك ملف PDF">
<button onclick="share()">عرض الملف</button>
<button onclick="location.href='dashboard.html'" style="background:#dc3545">خروج</button>
</div>
<div id="meet"></div>
<script>
let myName = localStorage.getItem('student_name') || 'مستر أحمد';
let room = new URLSearchParams(location.search).get('room') || 'ahmed1';
document.getElementById('s').innerText = 'أهلا يا ' + myName;
const api = new JitsiMeetExternalAPI('meet.ffmuc.net', {
  roomName: 'AhmedEnglish_'+room,
  parentNode: document.querySelector('#meet'),
  width:'100%', height:700,
  userInfo:{displayName:myName},
  configOverwrite:{prejoinPageEnabled:false},
  interfaceConfigOverwrite:{SHOW_JITSI_WATERMARK:false}
});
function share(){
  let link=document.getElementById('pdf').value;
  if(!link) return alert('حط لينك الـ PDF الاول');
  api.executeCommand('sendChatMessage','📚 ملف الحصة: '+link);
  window.open(link,'_blank');
}
</script>
</body>
</html>

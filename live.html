<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لايف مستر أحمد - تفاعلي بدون تسجيل</title>
<style>body{margin:0;font-family:system-ui;background:#0f0f1a;color:#fff}#gate{max-width:500px;margin:40px auto;background:#1e1e34;padding:24px;border-radius:16px;text-align:center}input{padding:12px;border-radius:10px;border:0;width:220px;margin:8px}.btn{padding:12px 20px;background:#5b5bf6;color:#fff;border:0;border-radius:10px;font-weight:bold;cursor:pointer}#meet{width:100%;height:100vh;display:none}</style>
<script src='https://meet.ffmuc.net/external_api.js'></script>
</head>
<body>
<div id="gate">
<h2>🔑 ادخل كودك الخاص</h2>
<p style="color:#aaa">الدخول مباشر من غير تسجيل</p>
<input id="codeIn" placeholder="EN-...">
<button class="btn" onclick="joinLive()">دخول الحصة</button>
<p id="err" style="color:#ff6b6b;display:none"></p>
<p style="font-size:12px;color:#777;margin-top:12px">كودك: <b id="hint"></b></p>
<p style="font-size:11px;color:#555">كود المدرس: <b>MR-AHMED-2026</b></p>
</div>
<div id="meet"></div>
<script>
document.getElementById('hint').innerText=localStorage.getItem('st_code')||'';
function joinLive(){
 let entered=document.getElementById('codeIn').value.trim();
 let my=localStorage.getItem('st_code');
 let isTeacher = entered==='MR-AHMED-2026';
 let blocked=JSON.parse(localStorage.getItem('blocked_codes')||'[]');
 if(blocked.includes(my) && !isTeacher){document.getElementById('err').style.display='block'; document.getElementById('err').innerText='🚫 كودك موقوف، كلم المستر'; return;}
 if(entered!==my && !isTeacher){document.getElementById('err').style.display='block'; document.getElementById('err').innerText='الكود غلط'; return;}
 document.getElementById('gate').style.display='none';
 document.getElementById('meet').style.display='block';
 const roomName = localStorage.getItem('live_room') || 'AhmedSemba-English-Live-2026-FINAL';
 const userName = isTeacher ? 'المستر أحمد 👨‍🏫' : (localStorage.getItem('st_name')||'طالب');
 const domain = 'meet.ffmuc.net';
 const options = {
   roomName: roomName,
   width: '100%',
   height: '100vh',
   parentNode: document.querySelector('#meet'),
   userInfo: { displayName: userName },
   configOverwrite: { startWithAudioMuted: !isTeacher, startWithVideoMuted: !isTeacher, prejoinPageEnabled: false },
   interfaceConfigOverwrite: { SHOW_JITSI_WATERMARK: false, TOOLBAR_BUTTONS: ['microphone','camera','desktop','chat','raisehand','participants-pane','mute-everyone','hangup'] }
 };
 const api = new JitsiMeetExternalAPI(domain, options);
}
</script>
</body>
</html>

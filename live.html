<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحصة لايف</title>
<style>body{font-family:system-ui;background:#0f0f1a;color:#fff;margin:0}.card{max-width:700px;margin:20px auto;background:#1e1e34;padding:20px;border-radius:16px}input{padding:12px;border-radius:10px;border:0;width:200px}.btn{padding:12px 18px;background:#5b5bf6;color:#fff;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin:12px 0}.video iframe{width:100%;height:100%;border:0}</style>
</head>
<body>
<div class="card" id="gate">
<h2 style="text-align:center">🔑 ادخل كودك الخاص</h2>
<p style="text-align:center;color:#aaa">كل طالب ليه كود مختلف</p>
<div style="text-align:center">
<input id="c" placeholder="EN-..."><button class="btn" onclick="check()">دخول</button>
<p id="err" style="color:#ff6b6b;display:none;margin-top:10px"></p>
<p style="color:#888;font-size:13px;margin-top:10px">كودك هو: <b id="hint"></b></p>
</div>
</div>
<div class="card" id="live" style="display:none">
<h3 id="lt">🔴 لايف مستر أحمد</h3>
<div class="video" id="vid"><p style="text-align:center;padding-top:80px;color:#888">المستر لسه مبدأش</p></div>
<div style="background:#111122;padding:12px;border-radius:10px;margin-top:10px">💬 الشات: المستر هيبعت الملزمة هنا كـ رابط تحميل</div>
</div>
<script>
document.getElementById('hint').innerText=localStorage.getItem('st_code')||'';
function check(){
let entered=document.getElementById('c').value.trim();
let my=localStorage.getItem('st_code');
let blocked=JSON.parse(localStorage.getItem('blocked_codes')||'[]');
if(blocked.includes(my)){document.getElementById('err').style.display='block'; document.getElementById('err').innerText='🚫 كودك موقوف، كلم المستر على الواتس'; return;}
if(entered===my){document.getElementById('gate').style.display='none'; document.getElementById('live').style.display='block'; let link=localStorage.getItem('live_link'); if(link){let emb=link.replace('watch?v=','embed/'); document.getElementById('vid').innerHTML=`<iframe src="${emb}" allowfullscreen></iframe>`;}}else{document.getElementById('err').style.display='block'; document.getElementById('err').innerText='الكود غلط، اكتب كودك انت اللي ظهر في الصفحة الرئيسية';}
}
</script>
</body>
</html>

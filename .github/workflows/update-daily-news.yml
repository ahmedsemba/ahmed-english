name: Update daily English news
on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-news-update
  cancel-in-progress: false
jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch and translate news
        run: python scripts/update_news.py
      - name: Commit updated news
        run: |
          if git diff --quiet -- news-data.json; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-data.json
          git commit -m "Update daily English news"
          git push

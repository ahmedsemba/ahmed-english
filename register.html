<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سجل الآن | منصة مستر أحمد السيد</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.png">
  <meta name="theme-color" content="#102a43">
  <link rel="stylesheet" href="app.css">
  <script>
    (function() {
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.add('theme-light');
      }
    })();
  </script>
</head>
<body data-page="register">

  <!-- الشريط العلوي الثابت -->
  <div class="site-top-bar">
    <a href="index.html" class="top-back-btn">← العودة للرئيسية</a>
    <span class="top-page-badge">✍️ تسجيل طالب جديد</span>
    <div class="top-actions">
      <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn">☀️</button>
    </div>
  </div>

  <div class="container">
    <div id="tab-register" class="card">
      <h3 style="margin-top:0">تسجيل طالب جديد 🎓</h3>
      <p style="color:var(--text-muted);font-size:13px;margin:0 0 14px">
        املأ البيانات التالية لإنشاء حساب الطالب. سيتم تفعيل حسابك من قِبل المستر وتصلك رسالة عبر الواتساب.
      </p>

      <label for="name" style="font-size:12px;font-weight:800">اسم الطالب ثلاثي</label>
      <input id="name" placeholder="مثال: أحمد محمد علي" autocomplete="name">

      <label for="phone" style="font-size:12px;font-weight:800;display:block;margin-top:10px">رقم واتساب الطالب</label>
      <input id="phone" type="tel" placeholder="رقم الواتساب (مثال: 010... أو 011...)" autocomplete="tel">

      <label for="parentPhone" style="font-size:12px;font-weight:800;display:block;margin-top:10px">رقم ولي الأمر</label>
      <input id="parentPhone" type="tel" placeholder="رقم هاتف ولي الأمر لمتابعة الدرجات" autocomplete="tel">

      <label for="grade" style="font-size:12px;font-weight:800;display:block;margin-top:10px">الصف الدراسي</label>
      <select id="grade">
        <option value="الصف الأول الابتدائي">الصف الأول الابتدائي</option>
        <option value="الصف الثاني الابتدائي">الصف الثاني الابتدائي</option>
        <option value="الصف الثالث الابتدائي">الصف الثالث الابتدائي</option>
        <option value="الصف الرابع الابتدائي">الصف الرابع الابتدائي</option>
        <option value="الصف الخامس الابتدائي">الصف الخامس الابتدائي</option>
        <option value="الصف السادس الابتدائي">الصف السادس الابتدائي</option>
        <option value="الصف الأول الإعدادي">الصف الأول الإعدادي</option>
        <option value="الصف الثاني الإعدادي">الصف الثاني الإعدادي</option>
        <option value="الصف الثالث الإعدادي">الصف الثالث الإعدادي</option>
      </select>

      <button type="button" onclick="registerStudent()" style="margin-top:16px;background:linear-gradient(135deg,var(--accent-teal),#0f766e);color:#fff">
        إرسال طلب التسجيل 🚀
      </button>

      <p id="regMsg" style="font-size:14px;font-weight:800;margin-top:12px;color:var(--accent-teal-light)"></p>
    </div>
  </div>

  <script type="module" src="platform.js"></script>
</body>
</html>
